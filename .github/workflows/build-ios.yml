name: Build unsigned iOS app
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  cancel_queued_attempt:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel the earlier queued attempt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/actions/runs/43251525339/cancel" > /dev/null || true
  build:
    runs-on: macos-26-intel
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Test desktop core
        run: node --test tests/core.test.cjs
      - name: Build for iPhone and iPad (unsigned)
        run: >-
          xcodebuild -project ios/PocketDesktop.xcodeproj
          -scheme PocketDesktop -sdk iphoneos -configuration Release
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PocketDesktop.app Payload/
          zip -qr PocketDesktop-unsigned.ipa Payload
      - name: Save IPA as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketDesktop-unsigned
          path: PocketDesktop-unsigned.ipa
          if-no-files-found: error
