name: Web apps unsigned iPhone build
on:
  push:
    branches: [feature/web-app-workspace-20261115]
    paths: [.github/workflows/webapps-device-build.yml]
permissions:
  contents: read
  statuses: write
jobs:
  device-build:
    name: Build unsigned iPhone IPA
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Publish build run link
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --method POST -f state=pending -f context=webapps-device-build -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
      - name: Check out project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check desktop logic
        run: node --test tests/core.test.cjs
      - name: Build for iPhone without signing
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build-artifacts
          xcodebuild -project ios/PocketDesktop.xcodeproj -scheme PocketDesktop \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | tee build-artifacts/device-build.log
      - name: Package unsigned IPA
        shell: bash
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PocketDesktop.app Payload/
          file Payload/PocketDesktop.app/PocketDesktop
          zip -qr build-artifacts/PocketDesktop-WebApps-unsigned.ipa Payload
          unzip -tq build-artifacts/PocketDesktop-WebApps-unsigned.ipa
      - name: Save unsigned build and log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pocket-desktop-webapps-unsigned
          path: build-artifacts/
          if-no-files-found: warn
      - name: Publish final build status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = success ]; then state=success; else state=failure; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --method POST -f state="$state" -f context=webapps-device-build -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
