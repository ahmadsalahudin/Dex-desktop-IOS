name: Web apps workspace verification
on:
  push:
    branches: [feature/web-app-workspace-20261115]
permissions:
  contents: read
  statuses: write
jobs:
  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Publish run link
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --method POST -f state=pending -f context=webapps-research -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/core.test.cjs tests/desktop.test.cjs tests/web-apps.test.cjs
      - name: Save browser test screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-app-browser-screenshots
          path: test-artifacts/
          if-no-files-found: warn
      - name: Publish final test status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = success ]; then state=success; else state=failure; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --method POST -f state="$state" -f context=webapps-research -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
