name: Debug iPhone web session after simulator shutdown
on:
  push:
    branches: ['debug/popup-only-20261116']
    paths: ['.github/workflows/debug-popup.yml']
permissions:
  contents: read
jobs:
  popup:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 70ca20332bc4e47170f09ef9d6bbdb3a297037d5
          persist-credentials: false
      - name: Start controlled test pages
        shell: bash
        run: |
          python3 tests/instrument_ios_webapps.py
          python3 tests/webapps_fixture.py > "$RUNNER_TEMP/pocket-fixture.log" 2>&1 &
          curl --retry 10 --retry-delay 1 --retry-connrefused --fail --silent http://127.0.0.1:18765/check > /dev/null
      - name: Boot iPhone 17 simulator
        shell: bash
        run: |
          SIMULATOR_ID=$(python3 .github/scripts/select-simulator.py 17)
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Retest two web windows and persistent session
        shell: bash
        run: |
          mkdir -p test-artifacts
          python3 - <<'PY'
          import os, subprocess, sys
          command = ["xcodebuild", "test", "-project", "ios/PocketDesktop.xcodeproj",
                     "-scheme", "PocketDesktop",
                     "-destination", "platform=iOS Simulator,id=" + os.environ["SIMULATOR_ID"],
                     "-only-testing:PocketDesktopUITests/PocketDesktopUITests/testSeparateWebWindowsAndPersistentSession",
                     "-resultBundlePath", "test-artifacts/WebSession.xcresult", "CODE_SIGNING_ALLOWED=NO"]
          result = 124
          with open("test-artifacts/xcodebuild.log", "w") as out:
              try:
                  result = subprocess.run(command, stdout=out, stderr=subprocess.STDOUT, timeout=600).returncode
              except subprocess.TimeoutExpired:
                  print("Session test exceeded the ten-minute diagnostic limit.")
          with open("test-artifacts/xcodebuild.log") as log:
              print("".join(log.readlines()[-100:]))
          sys.exit(result)
          PY
      - name: Capture simulator screen
        if: always() && env.SIMULATOR_ID != ''
        run: xcrun simctl io "$SIMULATOR_ID" screenshot test-artifacts/simulator.png || true
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-session-simulator-diagnostic
          path: test-artifacts/
          if-no-files-found: warn
