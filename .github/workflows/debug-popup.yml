name: Debug iPhone popup interaction
on:
  push:
    branches: ['debug/popup-only-20261116']
    paths: ['.github/workflows/debug-popup.yml']
permissions:
  contents: read
jobs:
  popup:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Start controlled test pages
        shell: bash
        run: |
          python3 tests/instrument_ios_webapps.py
          # Open the controlled page directly in this diagnostic only. Address
          # entry is exercised separately by the full simulator suite.
          python3 - <<'PY'
          from pathlib import Path
          app = Path('app/app.js')
          text = app.read_text()
          old = "browser:{title:'Browser',width:850,height:570}"
          new = "browser:{title:'Browser',width:850,height:570,url:'http://127.0.0.1:18765/set'}"
          assert text.count(old) == 1
          app.write_text(text.replace(old, new))
          test = Path('ios/PocketDesktopUITests/PocketDesktopUITests.swift')
          text = test.read_text()
          start = text.index('    func testWebPopupRetainsOpener()')
          first = text.index('        let address = ', start)
          last = text.index('        XCTAssertTrue(app.staticTexts["POCKET_SESSION_SET"]', first)
          test.write_text(text[:first] + text[last:])
          PY
          python3 tests/webapps_fixture.py > "$RUNNER_TEMP/pocket-fixture.log" 2>&1 &
          curl --retry 10 --retry-delay 1 --retry-connrefused --fail --silent http://127.0.0.1:18765/check > /dev/null
      - name: Boot iPhone 17 simulator
        shell: bash
        run: |
          SIMULATOR_ID=$(python3 .github/scripts/select-simulator.py 17)
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Test popup round trip with time limit
        shell: bash
        run: |
          mkdir -p test-artifacts
          python3 - <<'PY'
          import os, subprocess, sys
          command = ["xcodebuild", "test", "-project", "ios/PocketDesktop.xcodeproj",
                     "-scheme", "PocketDesktop",
                     "-destination", "platform=iOS Simulator,id=" + os.environ["SIMULATOR_ID"],
                     "-only-testing:PocketDesktopUITests/PocketDesktopUITests/testWebPopupRetainsOpener",
                     "-resultBundlePath", "test-artifacts/Popup.xcresult", "CODE_SIGNING_ALLOWED=NO"]
          result = 124
          with open("test-artifacts/xcodebuild.log", "w") as out:
              try:
                  result = subprocess.run(command, stdout=out, stderr=subprocess.STDOUT, timeout=360).returncode
              except subprocess.TimeoutExpired:
                  print("Popup test exceeded the six-minute diagnostic limit.")
          with open("test-artifacts/xcodebuild.log") as log:
              print("".join(log.readlines()[-100:]))
          sys.exit(result)
          PY
      - name: Capture simulator screen
        if: always() && env.SIMULATOR_ID != ''
        run: xcrun simctl io "$SIMULATOR_ID" screenshot test-artifacts/simulator.png || true
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: popup-simulator-diagnostic
          path: test-artifacts/
          if-no-files-found: warn
