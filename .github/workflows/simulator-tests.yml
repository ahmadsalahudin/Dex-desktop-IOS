name: Test on iOS Simulator
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  simulator:
    name: iPhone ${{ matrix.generation }} simulator
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - generation: '18'
            runner: xcode-27
          - generation: '17'
            runner: xcode-27
          - generation: '16'
            runner: macos-26
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify desktop logic
        run: node --test tests/core.test.cjs
      - name: Select and start iOS Simulator
        shell: bash
        run: |
          SIMULATOR_ID=$(python3 .github/scripts/select-simulator.py '${{ matrix.generation }}')
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Build and exercise the app
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-artifacts
          xcodebuild test -project ios/PocketDesktop.xcodeproj -scheme PocketDesktop \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath "test-artifacts/iPhone-${{ matrix.generation }}.xcresult" \
            CODE_SIGNING_ALLOWED=NO | tee test-artifacts/xcodebuild.log
      - name: Save simulator screen
        if: always() && env.SIMULATOR_ID != ''
        run: xcrun simctl io "$SIMULATOR_ID" screenshot "test-artifacts/iPhone-${{ matrix.generation }}.png" || true
      - name: Export XCTest screenshots
        if: always()
        shell: bash
        run: |
          result="test-artifacts/iPhone-${{ matrix.generation }}.xcresult"
          if [ -d "$result" ]; then
            mkdir -p test-artifacts/test-attachments
            xcrun xcresulttool export attachments --path "$result" --output-path test-artifacts/test-attachments || true
          fi
      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulator-iPhone-${{ matrix.generation }}
          path: test-artifacts/
          if-no-files-found: warn
